[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "forte26"
version = "0.1.0"
description = "Local video evidence review for ForteBank Datathon 26"
requires-python = ">=3.12,<3.13"
dependencies = [
  "av>=16,<18",
  "torch>=2.0",
  "laya @ git+https://github.com/NandhaKishorM/laya.git@d74e8be46ef5241e4ba2b16cd25e896f24f71373",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pillow>=12,<13",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.34,<1",
]

[project.scripts]
forte = "forte.cli:main"

[project.optional-dependencies]
inference-tracking = [
  "numpy==2.5.4",
  "onnxruntime==1.31.0",
  "pyyaml==6.0.3",
  "supervision==0.31.0",
  "trackers==2.6.1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "build>=1.2,<2",
    "jsonschema>=4.23,<5",
    "pyyaml==6.0.3",
]


[tool.hatch.build.targets.wheel]
packages = ["src/forte"]

[tool.hatch.build.targets.wheel.force-include]
"contracts/api-contract.json" = "forte/data/api-contract.json"
"configs/person-tracking.json" = "forte/data/person-tracking.json"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# Laya is CPU-only; do not pull a second CUDA runtime into the application env.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[tool.hatch.metadata]
allow-direct-references = true
