[project]
name = "forte-visual-sft-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "forte-visual-learning",
    "torch==2.13.0",
    "transformers==5.17.0",
    "peft==0.21.2",
    "accelerate==1.15.0",
    "torchvision==0.28.0",
]
[tool.uv.sources]
forte-visual-learning = {path = "../..", editable = true}
[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
