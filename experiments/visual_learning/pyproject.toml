[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "forte-visual-learning"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["forte26", "numpy==2.5.4"]

[project.scripts]
forte-visual = "forte_visual.cli:main"

[tool.uv.sources]
forte26 = { path = "../..", editable = true }

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.1", "build==1.6.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/forte_visual"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
